name: Public price monitor (opt-in)
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sentinel-public-state
  cancel-in-progress: false
jobs:
  monitor:
    if: vars.PUBLIC_SNAPSHOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PRICE_SENTINEL_DB: data/actions.sqlite3
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: sentinel-data
          path: snapshot-state
          # Dane są zapisywane wyłącznie w tej osobnej kopii.
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Restore (required, no empty fallback)
        id: restore
        run: price-sentinel restore snapshot-state/snapshot.json
      - name: Check offers
        id: check
        continue-on-error: true
        run: price-sentinel check
      - name: Save observations and outbox before sending
        id: presave
        run: |
          price-sentinel snapshot snapshot-state/snapshot.json --public --ack-public-data
          python scripts/persist_state.py snapshot-state
      - name: Send alerts and due reports
        id: notify
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          price-sentinel deliver
          price-sentinel report daily --notify
          price-sentinel report weekly --notify
      - name: Save delivery state even if notification failed
        if: always() && steps.restore.outcome == 'success'
        run: |
          price-sentinel snapshot snapshot-state/snapshot.json --public --ack-public-data
          python scripts/persist_state.py snapshot-state
      - name: Recovery snapshot (public data only)
        if: failure() && steps.restore.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: public-snapshot-recovery
          path: snapshot-state/snapshot.json
          retention-days: 7
      - name: Surface failed shop controls
        if: always() && steps.check.outcome == 'failure'
        run: exit 1
