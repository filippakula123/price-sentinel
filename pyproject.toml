[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "price-sentinel"
version = "0.1.0"
description = "Ostrożny monitoring cen polskich sklepów"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "beautifulsoup4>=4.12,<5", "pydantic>=2.10,<3", "matplotlib>=3.9,<4", "tzdata>=2025.1", "protego>=0.5,<1"]

[project.optional-dependencies]
discord = ["discord.py>=2.4,<3"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
price-sentinel = "price_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
